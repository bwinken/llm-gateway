# ============================================================
# Nginx 反向代理設定 — LLM Gateway
# ============================================================
# 部署位置: /etc/nginx/sites-available/llm-gateway.your-domain.com
# 啟用方式: ln -s /etc/nginx/sites-available/llm-gateway.your-domain.com /etc/nginx/sites-enabled/
#
# 本設定同時支援 HTTP (:80) 與 HTTPS (:443)，單一 server block
# 透過多個 listen 指令同時服務兩種協定；ssl_* 指令只會套用到
# 標記為 ssl 的 listener，因此 :80 的連線不會受影響。
#
# 三種常見部署情境：
#   (A) 純 HTTP  — 開發/內網：把 `listen 443 ssl` 以及所有 ssl_*
#       指令整段註解掉即可。
#   (B) HTTP + HTTPS 並存 — 需要同時服務兩種協定（預設）。
#   (C) 僅 HTTPS — 正式環境：保留兩個 listen，並取消下方
#       `return 301 https://...` 區塊的註解，讓 :80 的請求被
#       強制導向 HTTPS。
#
# 流量動線:
#   使用者 → Nginx (:80/:443)
#     ├── /oauth2/*  → OAuth2 Proxy  (127.0.0.1:4180) — 認證判斷
#     ├── /v1/*      → Gateway API   (127.0.0.1:8050) — Bearer API key 認證
#     ├── /static/   → 靜態檔案                       — 不走驗證
#     └── /          → Gateway Web   (127.0.0.1:8050) — auth_request + JWT 注入
# ============================================================

server {
    # ── 同時 listen HTTP 與 HTTPS ──
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name llm-gateway.your-domain.com;

    # ── TLS 憑證（以 Let's Encrypt 為例）──
    # 情境 A（純 HTTP）時，把這段整塊註解掉並拿掉上面的 443 listen
    ssl_certificate     /etc/letsencrypt/live/llm-gateway.your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/llm-gateway.your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── 情境 C：強制 HTTP → HTTPS ──
    # 啟用後，:80 的請求會被 301 導向 HTTPS；:443 仍照常服務。
    # if ($scheme = http) {
    #     return 301 https://$host$request_uri;
    # }

    # HSTS（啟用 HTTPS 後建議開啟；若之後可能退回 HTTP 請先不要開）
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 安全 Headers
    add_header X-Frame-Options       DENY;
    add_header X-Content-Type-Options nosniff;

    # 限制請求大小（VLM 請求可能包含 base64 圖片）
    client_max_body_size 50m;

    # ══════════════════════════════════════════
    #  OAuth2 Proxy 端點（認證用，不直接服務內容）
    # ══════════════════════════════════════════

    # OAuth2 Proxy 的登入/回呼/登出
    location /oauth2/ {
        proxy_pass       http://127.0.0.1:4180;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
    }

    # auth_request 內部端點 — Nginx 每次請求前問 OAuth2 Proxy「有登入嗎？」
    location = /oauth2/auth {
        internal;
        proxy_pass       http://127.0.0.1:4180;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # 不轉發 request body
        proxy_set_header Content-Length     "";
        proxy_pass_request_body            off;
    }

    # ══════════════════════════════════════════
    #  API 端點（Bearer API key 認證，不經過 oauth2-proxy）
    # ══════════════════════════════════════════

    location /v1/ {
        proxy_pass         http://127.0.0.1:8050;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE streaming 支援
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # ══════════════════════════════════════════
    #  Web UI（經 oauth2-proxy 認證後注入 JWT）
    # ══════════════════════════════════════════

    location / {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in?rd=$request_uri;

        # 從 oauth2-proxy 回傳的 header 取得 access token
        auth_request_set $auth_token $upstream_http_x_auth_request_access_token;

        # 注入 Authorization header 給 Gateway
        proxy_set_header Authorization "Bearer $auth_token";

        proxy_pass         http://127.0.0.1:8050;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE streaming 支援（dashboard 即時更新用）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # ── 靜態檔案（不走驗證，加速載入）──
    # __APP_DIR__ 會被 setup.sh 自動替換為實際路徑
    location /static/ {
        alias __APP_DIR__/app/static/;
        expires 7d;
        access_log off;
    }
}

# ----- WebSocket Upgrade Map -----
# 如果 nginx.conf 主設定中沒有以下 map，需加到 /etc/nginx/nginx.conf 的 http {} 裡：
#
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }
#
# ============================================================
# 搭配設定提醒
# ============================================================
# 啟用 HTTPS 後，請同步調整下列項目，確保 Cookie / OIDC 流程一致：
#
# 1. deploy/docker-compose.yml
#    oauth2-proxy 的環境變數：
#      - 情境 B（HTTP + HTTPS 並存）: OAUTH2_PROXY_COOKIE_SECURE=false
#        （否則 HTTP 訪問時瀏覽器不會送 cookie）
#      - 情境 C（強制 HTTPS）      : OAUTH2_PROXY_COOKIE_SECURE=true
#    並確認 OAUTH2_REDIRECT_URL 使用 https://...
#
# 2. AuthCenter 應用設定
#    Redirect URI 需加入 https://llm-gateway.your-domain.com/oauth2/callback
# ============================================================
