# ============================================================
# Nginx 反向代理設定 — LLM Gateway
# ============================================================
# 部署位置: /etc/nginx/sites-available/llm-gateway.your-domain.com
# 啟用方式: ln -s /etc/nginx/sites-available/llm-gateway.your-domain.com /etc/nginx/sites-enabled/
#
# 流量動線:
#   使用者 → Nginx (:80/443)
#     ├── /oauth2/*  → OAuth2 Proxy  (127.0.0.1:4180) — 認證判斷
#     ├── /v1/*      → Gateway API   (127.0.0.1:8050) — Bearer API key 認證（不經 oauth2-proxy）
#     ├── /static/   → 靜態檔案                       — 不走驗證，加速載入
#     └── /          → Gateway Web   (127.0.0.1:8050) — auth_request 保護 + JWT 注入
# ============================================================

server {
    listen 80;
    server_name llm-gateway.your-domain.com;

    # ----- HTTP → HTTPS（正式環境啟用）-----
    # return 301 https://$host$request_uri;

    # 安全 Headers
    add_header X-Frame-Options       DENY;
    add_header X-Content-Type-Options nosniff;

    # 限制請求大小（VLM 請求可能包含 base64 圖片）
    client_max_body_size 50m;

    # ══════════════════════════════════════════
    #  OAuth2 Proxy 端點（認證用，不直接服務內容）
    # ══════════════════════════════════════════

    # OAuth2 Proxy 的登入/回呼/登出
    location /oauth2/ {
        proxy_pass       http://127.0.0.1:4180;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
    }

    # auth_request 內部端點 — Nginx 每次請求前問 OAuth2 Proxy「有登入嗎？」
    location = /oauth2/auth {
        internal;
        proxy_pass       http://127.0.0.1:4180;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # 不轉發 request body
        proxy_set_header Content-Length     "";
        proxy_pass_request_body            off;
    }

    # ══════════════════════════════════════════
    #  API 端點（Bearer API key 認證，不經過 oauth2-proxy）
    # ══════════════════════════════════════════

    location /v1/ {
        proxy_pass         http://127.0.0.1:8050;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE streaming 支援
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # ══════════════════════════════════════════
    #  Web UI（經 oauth2-proxy 認證後注入 JWT）
    # ══════════════════════════════════════════

    location / {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in?rd=$request_uri;

        # 從 oauth2-proxy 回傳的 header 取得 access token
        auth_request_set $auth_token $upstream_http_x_auth_request_access_token;

        # 注入 Authorization header 給 Gateway
        proxy_set_header Authorization "Bearer $auth_token";

        proxy_pass         http://127.0.0.1:8050;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE streaming 支援（dashboard 即時更新用）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # ── 靜態檔案（不走驗證，加速載入）──
    # __APP_DIR__ 會被 setup.sh 自動替換為實際路徑
    location /static/ {
        alias __APP_DIR__/app/static/;
        expires 7d;
        access_log off;
    }
}

# ----- HTTPS 範本（正式環境）-----
# server {
#     listen 443 ssl http2;
#     server_name llm-gateway.your-domain.com;
#
#     ssl_certificate     /etc/letsencrypt/live/llm-gateway.your-domain.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/llm-gateway.your-domain.com/privkey.pem;
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_ciphers HIGH:!aNULL:!MD5;
#
#     # ... (與上方 HTTP 設定相同的 location 區塊)
# }

