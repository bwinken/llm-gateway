server {
    listen 80;
    server_name llm-gateway.your-domain.com;

    # 安全 Headers
    add_header X-Frame-Options       DENY;
    add_header X-Content-Type-Options nosniff;

    # 限制請求大小（VLM 請求可能包含 base64 圖片）
    client_max_body_size 50m;

    # ── oauth2-proxy 端點（公開，處理登入/登出）──
    location /oauth2/ {
        proxy_pass       http://127.0.0.1:4180;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # oauth2-proxy 內部驗證端點（nginx auth_request 使用）
    location = /oauth2/auth {
        internal;
        proxy_pass       http://127.0.0.1:4180;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Length     "";
        proxy_pass_request_body            off;
    }

    # ── API 端點（Bearer API key 認證，不經過 oauth2-proxy）──
    location /v1/ {
        proxy_pass         http://127.0.0.1:8050;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE streaming 支援
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # ── Web UI（經 oauth2-proxy 認證後注入 JWT）──
    location / {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in;

        # 從 oauth2-proxy 回傳的 header 取得 access token
        auth_request_set $auth_token $upstream_http_x_auth_request_access_token;

        # 注入 Authorization header 給 Gateway
        proxy_set_header Authorization "Bearer $auth_token";

        proxy_pass         http://127.0.0.1:8050;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE streaming 支援（dashboard 即時更新用）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # 靜態檔案（如有）
    # __APP_DIR__ 會被 setup.sh 自動替換為實際路徑
    location /static/ {
        alias __APP_DIR__/app/static/;
        expires 7d;
        access_log off;
    }
}
