# ============================================================
# Nginx 反向代理設定 — LLM Gateway
# ============================================================
# 部署位置: /etc/nginx/sites-available/llm-gateway.your-domain.com
# 啟用方式: ln -s /etc/nginx/sites-available/llm-gateway.your-domain.com /etc/nginx/sites-enabled/
#
# 本設定同時支援 HTTP (:80) 與 HTTPS (:443)，兩個 server block
# 共用 deploy/llm-gateway.locations.conf（需與本檔放在同一目錄，
# 或把 include 路徑改為實際部署位置，例如 /etc/nginx/snippets/）。
#
# 三種常見部署情境：
#   (A) 純 HTTP  — 開發/內網：只保留 :80 的 server block。
#   (B) HTTP + HTTPS 並存 — 需要同時服務兩種協定（預設）。
#   (C) 僅 HTTPS — 正式環境：在 :80 的 server block 用 301
#       強制導到 HTTPS（見下方註解）。
#
# 流量動線:
#   使用者 → Nginx (:80/:443)
#     ├── /oauth2/*  → OAuth2 Proxy  (127.0.0.1:4180) — 認證判斷
#     ├── /v1/*      → Gateway API   (127.0.0.1:8050) — Bearer API key 認證
#     ├── /static/   → 靜態檔案                       — 不走驗證
#     └── /          → Gateway Web   (127.0.0.1:8050) — auth_request + JWT 注入
# ============================================================

# ----- HTTP (:80) -----
server {
    listen 80;
    listen [::]:80;
    server_name llm-gateway.your-domain.com;

    # 若要強制 HTTPS（情境 C），把下一行取消註解、並移除下方 include：
    # return 301 https://$host$request_uri;

    include llm-gateway.locations.conf;
}

# ----- HTTPS (:443) -----
# 若僅需 HTTP（情境 A），把整個 server {} 區塊註解掉即可。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name llm-gateway.your-domain.com;

    # ── TLS 憑證（以 Let's Encrypt 為例）──
    ssl_certificate     /etc/letsencrypt/live/llm-gateway.your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/llm-gateway.your-domain.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS（啟用 HTTPS 後建議開啟；若之後可能要退回 HTTP 請先不要開）
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include llm-gateway.locations.conf;
}

# ----- WebSocket Upgrade Map -----
# 如果 nginx.conf 主設定中沒有以下 map，需加到 /etc/nginx/nginx.conf 的 http {} 裡：
#
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }
#
# ============================================================
# 搭配設定提醒
# ============================================================
# 啟用 HTTPS 後，請同步調整下列項目，確保 Cookie / OIDC 流程一致：
#
# 1. deploy/docker-compose.yml
#    oauth2-proxy 的環境變數改為：
#      OAUTH2_PROXY_COOKIE_SECURE: "true"
#    並確認 OAUTH2_REDIRECT_URL 使用 https://...
#
# 2. AuthCenter 應用設定
#    Redirect URI 需加入 https://llm-gateway.your-domain.com/oauth2/callback
#
# 3. 若保留 HTTP + HTTPS 並存（情境 B），OAUTH2_PROXY_COOKIE_SECURE
#    必須維持 "false"，否則 HTTP 訪問時瀏覽器不會送 cookie。
#    只在情境 C（強制 HTTPS）才設為 "true"。
# ============================================================
