# ============================================================
# Nginx 反向代理設定 — LLM Gateway
# ============================================================
# 部署位置: /etc/nginx/sites-available/llm-gateway.your-domain.com
# 啟用方式: ln -s /etc/nginx/sites-available/llm-gateway.your-domain.com /etc/nginx/sites-enabled/
#
# 本設定的 HTTPS 只服務 API 端點（/v1/、/azure/）：
#   - HTTP  (:80)  — 完整服務：Web UI、OAuth、API、靜態檔案
#   - HTTPS (:443) — 只服務 /v1/ 與 /azure/，其他路徑一律 404
#
# 為什麼這樣拆？
#   Web UI 走 oauth2-proxy + cookie，要讓 cookie 在 HTTP / HTTPS 都
#   能用得同時維護兩套 cookie 參數。如果只有 API client 需要 TLS，
#   讓 :443 僅承載 API 路徑可以完全避開 web 那一側的複雜度，
#   也讓 oauth2-proxy 的 COOKIE_SECURE 維持原本的 false 即可。
#
# 流量動線:
#   使用者/瀏覽器 → Nginx (:80)
#     ├── /oauth2/*  → OAuth2 Proxy  (127.0.0.1:4180)
#     ├── /v1/*      → Gateway API           (127.0.0.1:8050)
#     ├── /azure/*   → Gateway Azure API     (127.0.0.1:8050)
#     ├── /static/   → 靜態檔案
#     └── /          → Gateway Web           (127.0.0.1:8050)
#
#   API client → Nginx (:443, TLS)
#     ├── /v1/*      → Gateway API           (127.0.0.1:8050)
#     └── /azure/*   → Gateway Azure API     (127.0.0.1:8050)
# ============================================================

# ----- HTTP (:80) — 完整服務 -----
server {
    listen 80;
    listen [::]:80;
    server_name llm-gateway.your-domain.com;

    # 安全 Headers
    add_header X-Frame-Options       DENY;
    add_header X-Content-Type-Options nosniff;

    # 限制請求大小（VLM 請求可能包含 base64 圖片）
    client_max_body_size 50m;

    # ══════════════════════════════════════════
    #  OAuth2 Proxy 端點（認證用，不直接服務內容）
    # ══════════════════════════════════════════

    # OAuth2 Proxy 的登入/回呼/登出
    location /oauth2/ {
        proxy_pass       http://127.0.0.1:4180;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
    }

    # auth_request 內部端點 — Nginx 每次請求前問 OAuth2 Proxy「有登入嗎？」
    location = /oauth2/auth {
        internal;
        proxy_pass       http://127.0.0.1:4180;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # 不轉發 request body
        proxy_set_header Content-Length     "";
        proxy_pass_request_body            off;
    }

    # ══════════════════════════════════════════
    #  API 端點（Bearer API key 認證，不經過 oauth2-proxy）
    # ══════════════════════════════════════════

    location /v1/ {
        proxy_pass         http://127.0.0.1:8050;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE streaming 支援
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # /azure/v1/* 與 /azure/messages — Azure OpenAI 後端
    # 同樣使用 Bearer API key 認證，不經過 oauth2-proxy
    location /azure/ {
        proxy_pass         http://127.0.0.1:8050;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE streaming 支援
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # ══════════════════════════════════════════
    #  Web UI（經 oauth2-proxy 認證後注入 JWT）
    # ══════════════════════════════════════════

    location / {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in?rd=$request_uri;

        # 從 oauth2-proxy 回傳的 header 取得 access token
        auth_request_set $auth_token $upstream_http_x_auth_request_access_token;

        # 注入 Authorization header 給 Gateway
        proxy_set_header Authorization "Bearer $auth_token";

        proxy_pass         http://127.0.0.1:8050;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE streaming 支援（dashboard 即時更新用）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # ── 靜態檔案（不走驗證，加速載入）──
    # __APP_DIR__ 會被 setup.sh 自動替換為實際路徑
    location /static/ {
        alias __APP_DIR__/app/static/;
        expires 7d;
        access_log off;
    }
}

# ----- HTTPS (:443) — 只開放 /v1/ 與 /azure/ -----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name llm-gateway.your-domain.com;

    # ── TLS 憑證（以 Let's Encrypt 為例）──
    ssl_certificate     /etc/letsencrypt/live/llm-gateway.your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/llm-gateway.your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全 Headers
    add_header X-Frame-Options       DENY;
    add_header X-Content-Type-Options nosniff;

    # 限制請求大小（VLM 請求可能包含 base64 圖片）
    client_max_body_size 50m;

    # ══════════════════════════════════════════
    #  /v1/ 與 /azure/ — 開放走 HTTPS 的 API 路徑
    # ══════════════════════════════════════════
    location /v1/ {
        proxy_pass         http://127.0.0.1:8050;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE streaming 支援
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    location /azure/ {
        proxy_pass         http://127.0.0.1:8050;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE streaming 支援
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # 其他路徑一律 404（Web UI / OAuth / 靜態檔案都走 HTTP）
    location / {
        return 404;
    }
}

# ----- WebSocket Upgrade Map -----
# 如果 nginx.conf 主設定中沒有以下 map，需加到 /etc/nginx/nginx.conf 的 http {} 裡：
#
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }
