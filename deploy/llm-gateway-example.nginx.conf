# ============================================================
# Nginx 反向代理設定 — LLM Gateway（全站 HTTPS）
# ============================================================
# 部署位置: /etc/nginx/sites-available/llm-gateway.your-domain.com
# 啟用方式: ln -s /etc/nginx/sites-available/llm-gateway.your-domain.com /etc/nginx/sites-enabled/
#
# 所有服務都走 HTTPS：
#   - HTTPS (:443) — 完整服務：Web UI、OAuth、API、靜態檔案、健康檢查
#   - HTTP  (:80)  — 只做 308 轉址到 https://（健康檢查可選擇保留在 HTTP）
#
# 為什麼用 308 而不是 301？
#   301 會讓不少 client 把 POST 改成 GET、丟掉 body，API 呼叫就壞了。
#   308 保留原本的 method 與 body，瀏覽器也都支援。
#   但轉址只是保險：有些 client 在 http→https 轉址時會丟掉 Authorization
#   header 或不跟隨 POST 的轉址，所以 client 的 base URL 仍要改成 https://。
#
# 搭配設定：
#   - oauth2-proxy 的 OAUTH2_PROXY_COOKIE_SECURE=true（deploy/docker-compose.yml）
#   - deploy/.env 的 OAUTH2_REDIRECT_URL=https://<domain>/oauth2/callback，
#     並在 AuthCenter（OIDC）的 client 允許這個 callback
#
# 流量動線:
#   瀏覽器 / API client → Nginx (:80) → 308 → https://（/healthz、/readyz 可選擇直接服務）
#
#   瀏覽器 / API client → Nginx (:443, TLS)
#     ├── /oauth2/*  → OAuth2 Proxy          (127.0.0.1:4180)
#     ├── /v1/*      → Gateway API           (127.0.0.1:8050)
#     ├── /azure/*   → Gateway Azure API     (127.0.0.1:8050)
#     ├── /aws/*     → Gateway Bedrock API   (127.0.0.1:8050)
#     ├── = /me      → Gateway               (127.0.0.1:8050，API key 認證)
#     ├── /auth/*    → Gateway               (127.0.0.1:8050，terminal 工具以 SSO token 換 API key)
#     ├── /healthz   → Gateway liveness      (127.0.0.1:8050，免認證)
#     ├── /readyz    → Gateway readiness     (127.0.0.1:8050，免認證)
#     ├── /static/   → 靜態檔案
#     └── /          → Gateway Web           (127.0.0.1:8050，經 oauth2-proxy 登入)
# ============================================================

# ----- HTTP (:80) — 轉址到 HTTPS -----
server {
    listen 80;
    listen [::]:80;
    server_name llm-gateway.your-domain.com;

    # （選用）LB / 監控若用 HTTP 打健康檢查，保留這條；不需要就刪掉，
    # 健康檢查也會跟著被轉到 https。
    location ~ ^/(healthz|readyz)$ {
        proxy_pass         http://127.0.0.1:8050;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ── （選用）過渡期：API 暫時繼續走 HTTP ──
    # 從「Web UI 只走 HTTP」的舊部署搬過來時，可以先讓 API 路徑在 :80 照常
    # 服務、記在獨立的 access log，看還有誰用 http:// 打 API，等這份 log
    # 沒有新請求了，再刪掉這段，讓 API 也被 308 轉到 https。
    # 這段開著的期間，管理後台 → Clients 分頁可以打開 CC002
    # （Base URL still uses http://）規則：直接列出還在用 http 的帳號，並在他們的
    # dashboard 顯示提醒、提供改 ANTHROPIC_BASE_URL 的 patch、寄信通知。
    #
    # location ~ ^/(v1|azure|aws)/|^/me$ {
    #     access_log /var/log/nginx/llm-gateway-http-api.log;
    #     proxy_pass         http://127.0.0.1:8050;
    #     proxy_set_header   Host              $host;
    #     proxy_set_header   X-Real-IP         $remote_addr;
    #     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header   X-Forwarded-Proto $scheme;
    #     proxy_buffering off;
    #     proxy_cache off;
    #     proxy_read_timeout 300s;
    #     chunked_transfer_encoding on;
    # }

    # 其他一律轉到 https，保留 method 與 body（308）
    location / {
        return 308 https://$host$request_uri;
    }
}

# ----- HTTPS (:443) — 完整服務 -----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name llm-gateway.your-domain.com;

    # ── TLS 憑證（以 Let's Encrypt 為例；內網可用公司 CA 或 deploy/gen-selfsigned-cert.sh）──
    ssl_certificate     /etc/letsencrypt/live/llm-gateway.your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/llm-gateway.your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全 Headers
    # 注意：location 裡只要有任何 add_header，就不會再繼承這裡的 add_header。
    # 下面的 location 刻意都不加 add_header；若之後要加，請把這幾行一起複製進去。
    add_header X-Frame-Options       DENY;
    add_header X-Content-Type-Options nosniff;

    # （選用）HSTS：確認全站 https 都正常、憑證穩定後再打開。先用短的
    # max-age（1 天）試，沒問題再拉長（例如 31536000 = 1 年）。打開後瀏覽器
    # 在 max-age 期間只會用 https 連這個網域，要退回 http 會很麻煩。
    # add_header Strict-Transport-Security "max-age=86400" always;

    # 限制請求大小（VLM 請求可能包含 base64 圖片）
    client_max_body_size 50m;

    # ── （選用）來源網段白名單：外層粗篩 ──
    # 寫在 server 區塊層級，下面每個 location 都會繼承；依序比對，第一條符合的生效。
    # 注意：現在 Web UI、登入（/oauth2/）與管理頁面也都在這個 server 裡，
    # 這裡的 allow/deny 會一併擋住它們。只想限制 API 的話，請把 allow/deny
    # 改寫進 /v1/、/azure/、/aws/、= /me 各自的 location。
    # nginx 只看得到 IP、不知道 API key 是誰的，所以「某網段只給某些人、限定時間」
    # 要在 gateway 的 IP Allowlist 設定（Admin → Security → IP Allowlist）。
    # 這裡若要設，必須涵蓋 gateway 所有規則用到的網段（A ∪ B ∪ C）：被 nginx
    # 擋掉的請求不會進到 gateway，gateway 為這些網段設的規則就完全無效。
    # /healthz、/readyz 也在這個 server 裡：LB 的健康檢查來源要一起 allow。
    # allow 10.0.0.0/8;          # 公司內網
    # allow 172.16.0.0/12;
    # allow 192.168.0.0/16;
    # allow 203.0.113.0/24;      # 合作廠商辦公室
    # allow 2001:db8::/32;       # IPv6 也可以
    # deny  all;

    # ══════════════════════════════════════════
    #  OAuth2 Proxy 端點（認證用，不直接服務內容）
    # ══════════════════════════════════════════

    # OAuth2 Proxy 的登入/回呼/登出
    location /oauth2/ {
        proxy_pass       http://127.0.0.1:4180;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
    }

    # auth_request 內部端點 — Nginx 每次請求前問 OAuth2 Proxy「有登入嗎？」
    #
    # SSO 換成 Keycloak 時：它的 token 與登入 cookie 比 AuthCenter 的大。error log
    # 出現 "upstream sent too big header while reading response header from upstream"
    # 就在這個 location 和上面的 location /oauth2/ 各加這三行：
    #     proxy_buffer_size       16k;
    #     proxy_buffers           8 16k;
    #     proxy_busy_buffers_size 32k;
    location = /oauth2/auth {
        internal;
        proxy_pass       http://127.0.0.1:4180;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # 不轉發 request body
        proxy_set_header Content-Length     "";
        proxy_pass_request_body            off;
    }

    # ══════════════════════════════════════════
    #  API 端點（Bearer API key 認證，不經過 oauth2-proxy）
    # ══════════════════════════════════════════

    location /v1/ {
        proxy_pass         http://127.0.0.1:8050;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE streaming 支援
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # /azure/v1/* 與 /azure/messages — Azure OpenAI 後端
    # 同樣使用 Bearer API key 認證，不經過 oauth2-proxy
    location /azure/ {
        proxy_pass         http://127.0.0.1:8050;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE streaming 支援
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # /aws/v1/* 與 /aws/messages — AWS Bedrock 後端
    # 同樣使用 Bearer API key 認證，不經過 oauth2-proxy
    location /aws/ {
        proxy_pass         http://127.0.0.1:8050;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE streaming 支援
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # /me — 查詢自己的權限與今日額度（/v1/me 已由 location /v1/ 涵蓋）
    # Bearer API key 認證，不經過 oauth2-proxy。精確比對（=）優先於
    # 任何前綴 location，所以不會被下面的 `location /`（auth_request）攔下來。
    location = /me {
        proxy_pass         http://127.0.0.1:8050;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # /auth/ — 非瀏覽器的 client（terminal 工具）登入用：
    #   POST /auth/api-key，帶 AuthCenter 發的 access token，換回該帳號的 API key。
    # 不經過 oauth2-proxy，也不要在這裡改寫 Authorization：client 自己帶的
    # token 必須原樣送到 gateway，由 gateway 用 AuthCenter 的公鑰驗證。
    # 少了這段，請求會落到下面的 `location /`，被導去瀏覽器登入頁。
    # 只放在 :443：這裡傳的是 SSO token 和 API key，不能走明文 http。
    location /auth/ {
        proxy_pass         http://127.0.0.1:8050;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ══════════════════════════════════════════
    #  健康檢查（不經 oauth2-proxy — LB / 監控用）
    # ══════════════════════════════════════════
    #  /healthz — liveness：process 還活著（不碰 DB，永遠 200）
    #  /readyz  — readiness：DB 可用才回 200，否則 503
    #  正規表示式 location 的優先權高於前綴 location，所以這兩條不會
    #  被下面的 `location /`（auth_request）攔下來。
    location ~ ^/(healthz|readyz)$ {
        proxy_pass         http://127.0.0.1:8050;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        access_log off;
    }

    # /metrics — Prometheus（.env 設 METRICS_ENABLED=true 才有）。不經 nginx
    # 對外開放：Prometheus 直接抓 http://127.0.0.1:8050/metrics。精確比對（=）
    # 優先於 `location /`，否則任何登入的使用者都看得到。
    location = /metrics {
        return 404;
    }

    # ══════════════════════════════════════════
    #  Web UI（經 oauth2-proxy 認證後注入 JWT）
    # ══════════════════════════════════════════

    location / {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in?rd=$request_uri;

        # 從 oauth2-proxy 回傳的 header 取得 access token
        auth_request_set $auth_token $upstream_http_x_auth_request_access_token;

        # 注入 Authorization header 給 Gateway
        proxy_set_header Authorization "Bearer $auth_token";

        proxy_pass         http://127.0.0.1:8050;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE streaming 支援（dashboard 即時更新用）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # ── 靜態檔案（不走驗證，加速載入）──
    # __APP_DIR__ 會被 setup.sh 自動替換為實際路徑
    location /static/ {
        alias __APP_DIR__/app/static/;
        expires 7d;
        access_log off;
    }
}

# ----- WebSocket Upgrade Map -----
# 如果 nginx.conf 主設定中沒有以下 map，需加到 /etc/nginx/nginx.conf 的 http {} 裡：
#
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }
