{% extends "base.html" %}

        <div class="space-y-3">
            <div class="mx-auto w-16 h-16 bg-gray-900 rounded-2xl flex items-center justify-center text-white font-bold text-3xl">

            <h1 class="text-3xl font-bold text-gray-900">LLM Gateway</h1>
