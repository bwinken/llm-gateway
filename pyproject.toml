[project]
name = "llm-gateway"
version = "0.1.0"
description = "OpenAI-compatible reverse proxy gateway for vLLM clusters"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "httpx>=0.27.0",
    "sqlmodel>=0.0.22",
    "psycopg2-binary>=2.9.9",
    "PyJWT[crypto]>=2.8.0",
    "python-dotenv>=1.0.1",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "toml>=0.10.2",
    "alembic>=1.13.0",
    "loguru>=0.7.0",
    "openpyxl>=3.1.5",
    # IANA timezone database — zoneinfo falls back to this when the OS
    # doesn't ship tz data (Windows, slim/Alpine Docker images). Required
    # by app/core/timeutil.py's ZoneInfo lookup.
    "tzdata>=2024.1",
    "langfuse>=4.7.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6",
]
[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["alembic/versions"]

# Deliberately narrow: pyflakes (F) plus the pycodestyle rules that flag real
# errors rather than formatting taste. The wider default set fights this
# codebase's intentional patterns — blind `except Exception` (observability and
# billing hooks must never break a request), FastAPI's `Depends()` in argument
# defaults, and `datetime.timezone.utc` — so enabling them would mean either a
# repo-wide rewrite or a carpet of noqa comments. What is on here is signal:
# unused imports, undefined names, dead locals, syntax errors.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Test modules import fixtures for their side effects.
"tests/conftest.py" = ["F401"]
# Standalone maintenance scripts must extend sys.path and load .env before
# they can import anything under app/ — the late imports are the point.
"scripts/*.py" = ["E402"]
