name: Security

# Dependency vulnerabilities (pip-audit on uv.lock) and committed secrets
# (gitleaks). Runs on every PR and push to main, and weekly so a newly
# published advisory against an unchanged lock still shows up.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 2 * * 1"   # Mondays 02:23 UTC
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # Runtime dependencies exactly as uv.lock pins them (hashes included,
      # so pip-audit checks those versions without resolving anything).
      - name: Export locked dependencies
        run: uv export --locked --no-dev --no-emit-project --format requirements-txt -o requirements-audit.txt

      # Any known vulnerability fails the job. An accepted exception is an
      # `--ignore-vuln <ID>` line here, with its assessment in a comment
      # above it; remove it as soon as the fix ships. None today.
      - name: pip-audit
        run: >-
          uvx pip-audit==2.10.1
          -r requirements-audit.txt --require-hashes --disable-pip

  secrets:
    name: Committed secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read   # to list a PR's commits
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # PRs: the PR's commits. Pushes: the pushed commits. Schedule and
      # manual runs: the whole history. Rules are gitleaks' defaults plus
      # the allowlist in .gitleaks.toml (test fixtures, example config).
      # Free for repositories owned by a personal account; an organization
      # owner would need GITLEAKS_LICENSE.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
