name: Security

# Dependency vulnerabilities (pip-audit on uv.lock) and committed secrets
# (gitleaks). Runs on every PR and push to main, and weekly so a newly
# published advisory against an unchanged lock still shows up.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 2 * * 1"   # Mondays 02:23 UTC
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Runtime dependencies exactly as uv.lock pins them (hashes included,
      # so pip-audit checks those versions without resolving anything).
      - name: Export locked dependencies
        run: uv export --locked --no-dev --no-emit-project --format requirements-txt -o requirements-audit.txt

      # Each --ignore-vuln is an accepted, reviewed exception. Remove it as
      # soon as the fix ships; never add one without a reason here.
      #
      # starlette 0.52.x: every fix is in 1.x, which breaks the template
      # rendering (TemplateResponse) and needs its own migration. Assessed:
      #   PYSEC-2026-161 / -248  request.url rebuilt from an unvalidated Host /
      #     path. Behind nginx (Host = $host, server_name), low.
      #   PYSEC-2026-249  urlencoded form limits ignored. Forms are only on
      #     /admin and /dashboard, which nginx only passes once logged in.
      #   PYSEC-2026-2280 HTTPEndpoint method lookup: not used.
      #   PYSEC-2026-2281 StaticFiles on Windows: not used (nginx serves /static/).
      - name: pip-audit
        run: >-
          uvx pip-audit==2.10.1
          -r requirements-audit.txt --require-hashes --disable-pip
          --ignore-vuln PYSEC-2026-161
          --ignore-vuln PYSEC-2026-248
          --ignore-vuln PYSEC-2026-249
          --ignore-vuln PYSEC-2026-2280
          --ignore-vuln PYSEC-2026-2281

  secrets:
    name: Committed secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read   # to list a PR's commits
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # PRs: the PR's commits. Pushes: the pushed commits. Schedule and
      # manual runs: the whole history. Rules are gitleaks' defaults plus
      # the allowlist in .gitleaks.toml (test fixtures, example config).
      # Free for repositories owned by a personal account; an organization
      # owner would need GITLEAKS_LICENSE.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
