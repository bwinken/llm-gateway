name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request supersedes its previous run. A push to main is
# never superseded (its group is its own commit): every merge is tested and,
# when it raised the version, tagged, even when two land minutes apart.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.11

      # --locked: install exactly what uv.lock pins AND fail if that lock is
      # out of sync with pyproject.toml, so a forgotten `uv lock` shows up
      # here. (--frozen would install from the lock but skip that check.)
      - name: Sync dependencies
        run: uv sync --locked --dev

      - name: Lint
        run: uv run ruff check .

      # app/static/css/tailwind.css is built from the templates' class names
      # and committed (servers only git pull). This fails a change that edits
      # a template without rebuilding it: run `bash scripts/build_css.sh` and
      # commit the result. Downloads Tailwind's pinned standalone program.
      - name: Stylesheet up to date
        run: bash scripts/build_css.sh --check

      # No config.toml in the checkout (it is gitignored — it holds real
      # downstream URLs and API keys). app/core/config.py falls back to
      # config.toml.example, which tests/test_config_fallback.py validates.
      - name: Test
        run: uv run pytest tests/ -q

  # The version is written in pyproject.toml and every pull request raises
  # it. Once a merge to main has passed the tests above, its commit is tagged
  # v<version>, so each release can be found, compared and gone back to.
  # It only tags: it never changes the version, and never moves a tag. A
  # merge that did not raise the version finds its tag taken and gets none
  # (the run carries a warning).
  tag:
    name: Tag the release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # to push the tag; nothing else in this workflow writes
    steps:
      - uses: actions/checkout@v7

      - name: Tag this commit with its version
        run: bash scripts/tag_release.sh
